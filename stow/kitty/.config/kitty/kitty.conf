# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.5

# Cursor
cursor_shape     block
cursor_blink_interval 0

# Scrollback
scrollback_lines 10000

# Mouse
mouse_hide_wait  3.0
url_style        curly

# Terminal bell
enable_audio_bell no
visual_bell_duration 0.0

# Window layout
window_padding_width 4
hide_window_decorations yes
confirm_os_window_close 0

# Colors (Tokyo Night theme - discrete and professional)
foreground            #a9b1d6
background            #1a1b26
selection_foreground  #c0caf5
selection_background  #283457

# Cursor colors
cursor                #c0caf5
cursor_text_color     #1a1b26

# URL underline color when hovering with mouse
url_color             #73daca

# Kitty window border colors
active_border_color   #00FF00
inactive_border_color #0000FF
bell_border_color     #e0af68

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #16161e
active_tab_background   #7aa2f7
active_tab_font_style   bold
inactive_tab_foreground #545c7e
inactive_tab_background #292e42
inactive_tab_font_style normal
tab_bar_background      #15161e

# Colors for marks (marked text in the terminal)
mark1_foreground #1a1b26
mark1_background #7aa2f7
mark2_foreground #1a1b26
mark2_background #e0af68
mark3_foreground #1a1b26
mark3_background #f7768e

# The 16 terminal colors

# black
color0 #414868
color8 #414868

# red
color1 #f7768e
color9 #f7768e

# green
color2  #9ece6a
color10 #9ece6a

# yellow
color3  #e0af68
color11 #e0af68

# blue
color4  #7aa2f7
color12 #7aa2f7

# magenta
color5  #bb9af7
color13 #bb9af7

# cyan
color6  #7dcfff
color14 #7dcfff

# white
color7  #c0caf5
color15 #c0caf5
