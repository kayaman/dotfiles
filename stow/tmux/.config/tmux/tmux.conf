# -- General Settings ----------------------------------------------------------
set -g default-terminal "screen-256color"  # Support 256 colors
set -g history-limit 20000                 # Increase scrollback buffer
set -g mouse on                            # Enable mouse support
set -s escape-time 0                       # Faster command sequences (Vim friendly)

# -- Key Bindings --------------------------------------------------------------
# Remap prefix from 'C-b' to 'C-a' (easier to reach)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Easy config reload
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# More intuitive pane splitting
bind | split-window -h -c "#{pane_current_path}"  # Vertical split
bind _ split-window -v -c "#{pane_current_path}"  # Horizontal split

# Vim-style pane navigation
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# -- Display -------------------------------------------------------------------
set -g base-index 1           # Start window numbering at 1
setw -g pane-base-index 1      # Start pane numbering at 1
set -g renumber-windows on    # Automatically renumber windows when one is closed

# Status bar styling
set -g status-bg black
set -g status-fg white
