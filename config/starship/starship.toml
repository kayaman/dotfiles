command_timeout = 500

add_newline = true

# Prompt format — only show what matters
format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# Right prompt for less critical info
right_format = """$time"""

# ── Character (prompt symbol) ────────────────────────────────
[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold purple)'

# ── Directory ────────────────────────────────────────────────
[directory]
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = true
style = 'bold blue'
read_only = ' 🔒'

[directory.substitutions]
# '~/Projects' = ' '
# '~/projects' = ' '
# '~' = '~'

# ── Git ──────────────────────────────────────────────────────
[git_branch]
format = ' [$symbol$branch(:$remote_branch)]($style)'
symbol = ' '
style = 'bold purple'
truncation_length = 30

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = 'bold yellow'
conflicted = '=${count} '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕⇡${ahead_count}⇣${behind_count} '
untracked = '?${count} '
stashed = '*${count} '
modified = '!${count} '
staged = '+${count} '
deleted = '✘${count} '

# ── Languages ────────────────────────────────────────────────
[python]
format = ' [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\))]($style)'
symbol = ' '
style = 'yellow'
detect_files = ['pyproject.toml', 'requirements.txt', 'setup.py', 'Pipfile', '.python-version']
detect_extensions = ['py']

[nodejs]
format = ' [$symbol($version)]($style)'
symbol = ' '
style = 'green'
detect_files = ['package.json', '.node-version', '.nvmrc', 'tsconfig.json']
detect_extensions = ['js', 'ts', 'mjs', 'cjs', 'mts', 'cts']

# ── Docker ───────────────────────────────────────────────────
[docker_context]
format = ' [$symbol$context]($style)'
symbol = ' '
style = 'blue'
only_with_files = true
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']

# ── Command duration ─────────────────────────────────────────
[cmd_duration]
min_time = 2_000  # show if command took >2s
format = ' [took $duration]($style)'
style = 'bold yellow'
show_milliseconds = false

# ── Time (right prompt) ─────────────────────────────────────
[time]
disabled = false
format = '[$time]($style)'
style = 'dimmed white'
time_format = '%H:%M'

# ── Disabled modules (keep it fast) ─────────────────────────
[aws]
disabled = true

[gcloud]
disabled = true

[package]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[java]
disabled = true

[ruby]
disabled = true

[php]
disabled = true

[terraform]
disabled = true

[vagrant]
disabled = true

[nix_shell]
disabled = true

[conda]
disabled = true
