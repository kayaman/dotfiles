command_timeout = 1000
add_newline = true

palette = 'mocha'

# ── Prompt layout ────────────────────────────────────────────
format = """
[╭─](bold overlay)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$docker_context\
$fill\
$cmd_duration\
$time
[╰─](bold overlay)\
$character"""

right_format = ""

# ── Color palette (Catppuccin Mocha) ─────────────────────────
[palettes.mocha]
blue    = '#89b4fa'
green   = '#a6e3a1'
yellow  = '#f9e2af'
red     = '#f38ba8'
purple  = '#cba6f7'
peach   = '#fab387'
teal    = '#94e2d5'
overlay = '#6c7086'
text    = '#cdd6f4'
surface = '#313244'

# ── Character (prompt symbol) ────────────────────────────────
[character]
success_symbol = '[❯](bold green)'
error_symbol   = '[❯](bold red)'
vimcmd_symbol  = '[❮](bold purple)'

# ── OS indicator ─────────────────────────────────────────────
[os]
disabled = false
format   = '[$symbol]($style) '
style    = 'bold overlay'

[os.symbols]
Linux    = ''
Macos    = ''
Windows  = ''
Ubuntu   = ''
Arch     = ''
Fedora   = ''
openSUSE = ''

# ── Username (SSH only) ───────────────────────────────────────
[username]
show_always = false
format      = '[$user]($style)[@](bold overlay)'
style_user  = 'bold teal'
style_root  = 'bold red'

# ── Hostname (SSH only) ───────────────────────────────────────
[hostname]
ssh_only = true
format   = '[$ssh_symbol$hostname]($style) '
style    = 'bold teal'
ssh_symbol = '󰒋 '

# ── Directory ────────────────────────────────────────────────
[directory]
truncation_length  = 3
truncation_symbol  = '…/'
truncate_to_repo   = true
style              = 'bold blue'
read_only          = ' 󰌾'
read_only_style    = 'red'
format             = '[$path]($style)[$read_only]($read_only_style) '

# ── Git ──────────────────────────────────────────────────────
[git_branch]
format           = '[$symbol$branch(:$remote_branch)]($style) '
symbol           = ' '
style            = 'bold purple'
truncation_length = 30

[git_status]
format      = '([$all_status$ahead_behind]($style))'
style       = 'bold yellow'
conflicted  = '= '
ahead       = '⇡$count '
behind      = '⇣$count '
diverged    = '⇕⇡$ahead_count⇣$behind_count '
untracked   = '? '
stashed     = '󰆓 '
modified    = '! '
staged      = '+ '
deleted     = '✘ '

# ── Languages ────────────────────────────────────────────────
[python]
format           = '[$symbol$pyenv_prefix($version )(\($virtualenv\))]($style) '
symbol           = ' '
style            = 'yellow'
detect_files     = ['pyproject.toml', 'requirements.txt', 'setup.py', 'Pipfile', '.python-version']
detect_extensions = ['py']

[nodejs]
format           = '[$symbol($version)]($style) '
symbol           = ' '
style            = 'green'
detect_files     = ['package.json', '.node-version', '.nvmrc', 'tsconfig.json']
detect_extensions = ['js', 'ts', 'mjs', 'cjs', 'mts', 'cts']

# ── Docker ───────────────────────────────────────────────────
[docker_context]
format       = '[$symbol$context]($style) '
symbol       = ' '
style        = 'blue'
only_with_files = true
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']

# ── Fill (pushes time to right) ───────────────────────────────
[fill]
symbol = ' '
style  = 'overlay'

# ── Command duration ─────────────────────────────────────────
[cmd_duration]
min_time          = 2_000
format            = '[󱎫 $duration]($style) '
style             = 'bold peach'
show_milliseconds = false

# ── Time ─────────────────────────────────────────────────────
[time]
disabled    = false
format      = '[$time]($style)'
style       = 'overlay'
time_format = '%H:%M'

# ── Disabled modules ─────────────────────────────────────────
[aws]
disabled = true

[gcloud]
disabled = true

[package]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[java]
disabled = true

[ruby]
disabled = true

[php]
disabled = true

[terraform]
disabled = true

[vagrant]
disabled = true

[nix_shell]
disabled = true

[conda]
disabled = true
